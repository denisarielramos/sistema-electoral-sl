name: Apply voter add performance fix

on:
  push:
    branches:
      - fix/alta-votante-sin-recarga-total

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alta-votante-sin-recarga-total
          fetch-depth: 0

      - name: Patch Dashboard voter add flow
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python -c 'import os,base64,pathlib; p=pathlib.Path("src/components/Dashboard.jsx"); t=p.read_text(encoding="utf-8"); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); assert old in t or new in t, "Expected Dashboard block not found"; p.write_text(t if new in t else t.replace(old,new,1), encoding="utf-8")'

      - name: Commit patched Dashboard
        run: |
          if git diff --quiet -- src/components/Dashboard.jsx; then
            echo "No Dashboard changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "fix: avoid full reload after adding voter"
          git push origin HEAD:fix/alta-votante-sin-recarga-total
