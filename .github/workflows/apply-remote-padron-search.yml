name: Apply remote padron search integration

on:
  push:
    branches:
      - perf/busqueda-padron-bajo-demanda

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/busqueda-padron-bajo-demanda
          fetch-depth: 0

      - name: Patch Dashboard remote search integration
        env:
          OLD_EFFECT: 
          OLD_PERSONAS: ICBjb25zdCBwZXJzb25hc0Rpc3BvbmlibGVzID0gdXNlTWVtbygKICAgICgpID0+IGdldFBlcnNvbmFzRGlzcG9uaWJsZXMocGFkcm9uLCBlc3RydWN0dXJhKSwKICAgIFtwYWRyb24sIGVzdHJ1Y3R1cmFdCiAgKTsK
          NEW_PERSONAS: ICBjb25zdCBwZXJzb25hc0Rpc3BvbmlibGVzID0gdXNlTWVtbygKICAgICgpID0+IGdldFBlcnNvbmFzRGlzcG9uaWJsZXMoCiAgICAgIHBhZHJvbi5sZW5ndGggPiAwID8gcGFkcm9uIDogZXN0cnVjdHVyYVBhZHJvbiwKICAgICAgZXN0cnVjdHVyYQogICAgKSwKICAgIFtwYWRyb24sIGVzdHJ1Y3R1cmFQYWRyb24sIGVzdHJ1Y3R1cmFdCiAgKTsK
        run: |
          python -c "import base64,os; from pathlib import Path; p=Path('src/components/Dashboard.jsx'); t=p.read_text(encoding='utf-8'); oe=base64.b64decode(os.environ['OLD_EFFECT']).decode(); op=base64.b64decode(os.environ['OLD_PERSONAS']).decode(); np=base64.b64decode(os.environ['NEW_PERSONAS']).decode(); assert oe in t, 'lazy effect not found'; assert op in t, 'personasDisponibles block not found'; t=t.replace(oe,'',1).replace(op,np,1); p.write_text(t,encoding='utf-8')"

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "perf: stop full padron load for normal add flows"
          git push origin HEAD:perf/busqueda-padron-bajo-demanda
