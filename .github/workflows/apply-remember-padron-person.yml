name: Apply padron memory patch

on:
  push:
    branches:
      - perf/busqueda-padron-bajo-demanda

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/busqueda-padron-bajo-demanda
          fetch-depth: 0
      - name: Patch Dashboard
        env:
          OLD_STATS: ICAvLyA9PT09PT09PT09PT09PT09PT09PT09PSBFU1RBRMONU1RJQ0FTID09PT09PT09PT09PT09PT09PT09PT09CiAgY29uc3QgZXN0YWRpc3RpY2FzID0gdXNlTWVtbygK
          NEW_STATS: 
          OLD_VOT: 
          NEW_VOT: 
          OLD_COORD: 
          NEW_COORD: 
          OLD_SUB: 
          NEW_SUB: 
          OLD_DIR: 
          NEW_DIR: 
        run: |
          python -c "import base64,os; from pathlib import Path; p=Path('src/components/Dashboard.jsx'); t=p.read_text(encoding='utf-8'); pairs=[('OLD_STATS','NEW_STATS',1),('OLD_VOT','NEW_VOT',1),('OLD_COORD','NEW_COORD',0),('OLD_SUB','NEW_SUB',1),('OLD_DIR','NEW_DIR',1)];
for a,b,count in pairs:
 old=base64.b64decode(os.environ[a]).decode(); new=base64.b64decode(os.environ[b]).decode(); assert old in t, a+' not found'; t=t.replace(old,new,count) if count else t.replace(old,new)
p.write_text(t,encoding='utf-8')"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "fix: keep newly added padron data in memory"
          git push origin HEAD:perf/busqueda-padron-bajo-demanda
