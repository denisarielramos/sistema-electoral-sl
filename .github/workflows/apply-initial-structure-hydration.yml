name: Apply initial structure hydration optimization

on:
  push:
    branches:
      - perf/optimizar-carga-sin-romper-crud

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimizar-carga-sin-romper-crud
          fetch-depth: 0

      - name: Patch Dashboard initial hydration
        env:
          OLD_IMPORT: aW1wb3J0IFJlYWN0LCB7IHVzZUNhbGxiYWNrLCB1c2VFZmZlY3QsIHVzZU1lbW8sIHVzZVN0YXRlIH0gZnJvbSAicmVhY3QiOw==
          NEW_IMPORT: aW1wb3J0IFJlYWN0LCB7IHVzZUNhbGxiYWNrLCB1c2VFZmZlY3QsIHVzZU1lbW8sIHVzZVJlZiwgdXNlU3RhdGUgfSBmcm9tICJyZWFjdCI7
          OLD_STATES: ICBjb25zdCBbZXN0cnVjdHVyYUVycm9yLCBzZXRFc3RydWN0dXJhRXJyb3JdID0gdXNlU3RhdGUobnVsbCk7CiAgY29uc3QgW3BhZHJvbiwgc2V0UGFkcm9uXSA9IHVzZVN0YXRlKFtdKTsKICBjb25zdCBbcGFkcm9uTG9hZGVkLCBzZXRQYWRyb25Mb2FkZWRdID0gdXNlU3RhdGUoZmFsc2UpOw==
          NEW_STATES: 
          OLD_CARGAR: 
          NEW_CARGAR: 
          OLD_EFFECT: ICB1c2VFZmZlY3QoKCkgPT4gewogICAgY2FyZ2FyRXN0cnVjdHVyYSgpOwogICAgY2FyZ2FyUGFkcm9uKCk7CiAgfSwgW2NhcmdhckVzdHJ1Y3R1cmEsIGNhcmdhclBhZHJvbl0pOw==
          NEW_EFFECT: 
          OLD_MAP: 
          NEW_MAP: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          p = Path('src/components/Dashboard.jsx')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('OLD_IMPORT', 'NEW_IMPORT'),
              ('OLD_STATES', 'NEW_STATES'),
              ('OLD_CARGAR', 'NEW_CARGAR'),
              ('OLD_EFFECT', 'NEW_EFFECT'),
              ('OLD_MAP', 'NEW_MAP'),
          ]

          for old_key, new_key in replacements:
              old = base64.b64decode(os.environ[old_key]).decode('utf-8')
              new = base64.b64decode(os.environ[new_key]).decode('utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old_key}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "perf: hydrate visible structure before first render"
          git push origin HEAD:perf/optimizar-carga-sin-romper-crud
