name: Apply delete success alert cleanup

on:
  push:
    branches:
      - fix/quitar-alert-eliminacion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quitar-alert-eliminacion
          fetch-depth: 0

      - name: Remove success alert after deletion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Dashboard.jsx')
          text = path.read_text(encoding='utf-8')
          old = '      alert(`${nombre} fue eliminado de la estructura.`);\n'
          if old not in text:
              raise SystemExit('delete success alert not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "ux: remove redundant delete success alert"
          git push origin HEAD:fix/quitar-alert-eliminacion
