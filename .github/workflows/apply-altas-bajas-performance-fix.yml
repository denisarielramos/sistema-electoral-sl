name: Apply altas bajas performance fix

on:
  push:
    branches:
      - fix/altas-bajas-sin-recarga

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/altas-bajas-sin-recarga
          fetch-depth: 0

      - name: Patch Dashboard alta/baja flow
        env:
          OLD_VERIFY_B64: 
          NEW_VERIFY_B64: 
          OLD_DELETE_B64: 
          NEW_DELETE_B64: 
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path

          p = Path('src/components/Dashboard.jsx')
          t = p.read_text(encoding='utf-8')

          replacements = [
              ('OLD_VERIFY_B64', 'NEW_VERIFY_B64'),
              ('OLD_DELETE_B64', 'NEW_DELETE_B64'),
          ]
          for old_key, new_key in replacements:
              old = base64.b64decode(os.environ[old_key]).decode('utf-8')
              new = base64.b64decode(os.environ[new_key]).decode('utf-8')
              if new in t:
                  continue
              if old not in t:
                  raise SystemExit(f'Expected block not found: {old_key}')
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit patched Dashboard
        run: |
          if git diff --quiet -- src/components/Dashboard.jsx; then
            echo "No Dashboard changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "fix: speed up voter add and remove flows"
          git push origin HEAD:fix/altas-bajas-sin-recarga
