name: Apply lazy padron loading

on:
  push:
    branches:
      - perf/busqueda-padron-bajo-demanda

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/busqueda-padron-bajo-demanda
          fetch-depth: 0

      - name: Patch Dashboard lazy padron loading
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('src/components/Dashboard.jsx')
          t = p.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if new in t:
            raise SystemExit('Optimization already applied')
          if old not in t:
            raise SystemExit('Expected initialization block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit optimization and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git rm .github/workflows/apply-lazy-padron.yml
          git commit -m "perf: defer full padron loading for structure users"
          git push origin HEAD:perf/busqueda-padron-bajo-demanda
