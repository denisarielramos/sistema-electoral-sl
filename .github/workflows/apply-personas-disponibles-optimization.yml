name: Apply personas disponibles optimization

on:
  push:
    branches:
      - perf/optimizar-carga-sin-romper-crud

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimizar-carga-sin-romper-crud
          fetch-depth: 0

      - name: Patch getPersonasDisponibles
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('src/utils/estructuraHelpers.js')
          t = p.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if new in t:
            raise SystemExit('Optimization already applied')
          if old not in t:
            raise SystemExit('Expected original block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/estructuraHelpers.js
          git commit -m "perf: index structure CIs for padron availability"
          git push origin HEAD:perf/optimizar-carga-sin-romper-crud
