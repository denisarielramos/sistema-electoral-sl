name: Apply padron memory patch v2

on:
  push:
    branches:
      - perf/busqueda-padron-bajo-demanda

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/busqueda-padron-bajo-demanda
          fetch-depth: 0

      - name: Patch Dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/Dashboard.jsx')
          t = p.read_text(encoding='utf-8')

          marker = '  // ======================= ESTADÍSTICAS =======================\n'
          if 'const recordarPersonaPadron = useCallback' not in t:
              helper = "\n".join([
                  '  // Mantener en memoria los datos de padrón de una persona recién agregada evita',
                  '  // que su tarjeta vuelva a aparecer como "Cargando..." hasta el próximo login.',
                  '  const recordarPersonaPadron = useCallback((persona) => {',
                  '    const ci = normalizeCI(persona?.ci);',
                  '    if (!ci) return;',
                  '    const normalizada = { ...persona, ci };',
                  '    setEstructuraPadron((prev) => {',
                  '      const index = prev.findIndex((p) => normalizeCI(p.ci) === ci);',
                  '      if (index === -1) return [...prev, normalizada];',
                  '      const next = [...prev];',
                  '      next[index] = { ...next[index], ...normalizada };',
                  '      return next;',
                  '    });',
                  '  }, []);',
                  '',
              ]) + '\n'
              if marker not in t:
                  raise SystemExit('stats marker not found')
              t = t.replace(marker, helper + marker, 1)

          old = '    const { error } = await supabase.from("votantes").insert(payload);\n    if (error) { alert("Error al agregar votante: " + error.message); return; }\n    setShowAddModal(false);\n    await cargarEstructura();\n  }, [currentUser, estructura, cargarEstructura, verificarCIDisponible]);\n'
          new = '    const { error } = await supabase.from("votantes").insert(payload);\n    if (error) { alert("Error al agregar votante: " + error.message); return; }\n    recordarPersonaPadron(persona);\n    setShowAddModal(false);\n    await cargarEstructura();\n  }, [currentUser, estructura, cargarEstructura, verificarCIDisponible, recordarPersonaPadron]);\n'
          if new not in t:
              if old not in t: raise SystemExit('votante block not found')
              t = t.replace(old, new, 1)

          old = '    const savedCode = data?.login_code || loginCode;\n    alert(`Coordinador agregado. Código de acceso: ${savedCode}`);\n    setShowAgregarCoord(false);\n    await cargarEstructura();\n  }, [currentUser, cargarEstructura, verificarCIDisponible]);\n'
          new = '    const savedCode = data?.login_code || loginCode;\n    recordarPersonaPadron(persona);\n    alert(`Coordinador agregado. Código de acceso: ${savedCode}`);\n    setShowAgregarCoord(false);\n    await cargarEstructura();\n  }, [currentUser, cargarEstructura, verificarCIDisponible, recordarPersonaPadron]);\n'
          if new not in t:
              if old not in t: raise SystemExit('coordinador block not found')
              t = t.replace(old, new)

          old = '    const savedCode = data?.login_code || loginCode;\n    alert(`Subcoordinador agregado. Código de acceso: ${savedCode}`);\n    setShowAddModal(false);\n    await cargarEstructura();\n  }, [currentUser, cargarEstructura, verificarCIDisponible, onLogout]);\n'
          new = '    const savedCode = data?.login_code || loginCode;\n    recordarPersonaPadron(persona);\n    alert(`Subcoordinador agregado. Código de acceso: ${savedCode}`);\n    setShowAddModal(false);\n    await cargarEstructura();\n  }, [currentUser, cargarEstructura, verificarCIDisponible, onLogout, recordarPersonaPadron]);\n'
          if new not in t:
              if old not in t: raise SystemExit('subcoordinador block not found')
              t = t.replace(old, new, 1)

          old = '    const { data, error } = await supabase.from("dirigentes").insert(payload).select().single();\n    if (error) { alert("Error al agregar dirigente: " + error.message); return null; }\n    setShowAgregarDirigente(false);\n    await cargarEstructura();\n    return data?.login_code || loginCode;\n  }, [currentUser, cargarEstructura, verificarCIDisponible]);\n'
          new = '    const { data, error } = await supabase.from("dirigentes").insert(payload).select().single();\n    if (error) { alert("Error al agregar dirigente: " + error.message); return null; }\n    recordarPersonaPadron(persona);\n    setShowAgregarDirigente(false);\n    await cargarEstructura();\n    return data?.login_code || loginCode;\n  }, [currentUser, cargarEstructura, verificarCIDisponible, recordarPersonaPadron]);\n'
          if new not in t:
              if old not in t: raise SystemExit('dirigente block not found')
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx
          git commit -m "fix: keep newly added padron data in memory"
          git push origin HEAD:perf/busqueda-padron-bajo-demanda
